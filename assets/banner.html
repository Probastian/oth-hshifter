<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HShifter banner</title>
<style>
  :root {
    --ink: #101417;
    --white: #f4f6f7;
    --muted: #9aa7ad;
    --yellow: #f2c230;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ink); }
  body { position: relative; font-family: Bahnschrift, "Segoe UI", Arial, sans-serif; color: var(--white); }

  .sky {
    position: absolute; inset: 0;
    background:
      radial-gradient(1200px 700px at 78% 108%, rgba(242,194,48,.28), transparent 70%),
      linear-gradient(180deg, #11181c 0%, #1a2a2c 55%, #2a3a33 100%);
  }
  .hills { position: absolute; left: 0; bottom: 0; width: 1920px; height: 420px; }

  .copy { position: absolute; left: 140px; top: 0; bottom: 0; width: 900px; display: flex; flex-direction: column; justify-content: center; }
  .kicker { font-size: 30px; letter-spacing: .32em; text-transform: uppercase; color: var(--yellow); margin-bottom: 18px; }
  h1 { font-size: 150px; line-height: .95; font-weight: 700; letter-spacing: .01em; text-transform: uppercase; }
  .tag { margin-top: 34px; font-size: 44px; line-height: 1.25; color: #d7dee1; max-width: 800px; }
  .pills { margin-top: 48px; display: flex; gap: 16px; }
  .pill { padding: 12px 26px; border-radius: 999px; font-size: 26px; letter-spacing: .06em; background: rgba(244,246,247,.10); border: 2px solid rgba(244,246,247,.22); }
  .pill.l1 { background: var(--yellow); border-color: var(--yellow); color: var(--ink); font-weight: 700; }

  .gate { position: absolute; right: 120px; top: 190px; width: 800px; height: 700px; }
</style>
</head>
<body>
  <div class="sky"></div>
  <svg class="hills" viewBox="0 0 1920 420" preserveAspectRatio="none">
    <path d="M0 250 C 240 150, 480 130, 760 210 S 1260 300, 1560 190 S 1800 150, 1920 190 L1920 420 L0 420 Z" fill="#17252a" opacity=".85"/>
    <path d="M0 320 C 300 240, 560 260, 840 320 S 1380 380, 1640 290 S 1840 270, 1920 290 L1920 420 L0 420 Z" fill="#0f181b"/>
  </svg>

  <div class="copy">
    <div class="kicker">Over the Hill &middot; MelonLoader mod</div>
    <h1>H-Shifter</h1>
    <div class="tag">H-pattern manual shifter with a clutch.<br>Hold, shift, release.</div>
    <div class="pills">
      <span class="pill l1">L1 &nbsp;CLUTCH</span>
      <span class="pill">HIGH / LOW RANGE</span>
      <span class="pill">GAMEPAD</span>
    </div>
  </div>

  <svg class="gate" viewBox="0 0 800 700" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif">
    <!-- column labels -->
    <g fill="#9aa7ad" font-size="26" letter-spacing="6" text-anchor="middle">
      <text x="150" y="44">LOW</text>
      <text x="400" y="44">HIGH</text>
      <text x="650" y="44">REV</text>
    </g>
    <!-- rails -->
    <g stroke="#f4f6f7" stroke-opacity=".9" stroke-width="8" stroke-linecap="round" fill="none">
      <line x1="150" y1="350" x2="650" y2="350"/>
      <line x1="150" y1="130" x2="150" y2="570"/>
      <line x1="400" y1="130" x2="400" y2="570"/>
      <line x1="650" y1="130" x2="650" y2="350"/>
    </g>
    <!-- gear chips -->
    <g font-size="46" font-weight="700" text-anchor="middle" dominant-baseline="central">
      <g fill="#f4f6f7">
        <rect x="90"  y="90"  width="120" height="80" rx="20"/>
        <rect x="90"  y="530" width="120" height="80" rx="20"/>
        <rect x="340" y="90"  width="120" height="80" rx="20"/>
        <rect x="590" y="90"  width="120" height="80" rx="20"/>
      </g>
      <rect x="340" y="530" width="120" height="80" rx="20" fill="#f2c230"/>
      <g fill="#101417">
        <text x="150" y="131">1L</text>
        <text x="150" y="571">2L</text>
        <text x="400" y="131">1H</text>
        <text x="400" y="571">2H</text>
        <text x="650" y="131">R</text>
      </g>
    </g>
    <!-- lever -->
    <circle cx="400" cy="470" r="30" fill="#101417" stroke="#f4f6f7" stroke-width="8"/>
    <circle cx="400" cy="470" r="9" fill="#f2c230"/>
    <!-- neutral marker -->
    <text x="275" y="392" fill="#9aa7ad" font-size="18" letter-spacing="3" text-anchor="middle">NEUTRAL CHANNEL</text>
  </svg>
</body>
</html>
